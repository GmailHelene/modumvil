# ---------------------------------------------------------------------------
# Kopier denne filen til "config.yaml" og fyll inn dine egne verdier.
# config.yaml er ignorert av git, så API-nøklene dine havner ALDRI på GitHub.
# ---------------------------------------------------------------------------

exchange: binance          # Hvilken børs (binance, coinbase, kraken ...)
symbol: BTC/USDT           # Hva vi handler
timeframe: 1h              # Candlestick-lengde (1m, 5m, 15m, 1h, 4h, 1d)

# --- Strategi -------------------------------------------------------------
strategy:
  name: trend_filter       # Anbefalt. Se bot/strategy.py for alle strategier.
  params:
    fast: 20               # Kort glidende snitt
    slow: 50               # Mellomlangt glidende snitt
    trend: 200             # Langt snitt = trendfilter (kjøper kun i opptrend)

# --- Penger -------------------------------------------------------------
starting_cash: 1000        # Startkapital (kun for paper trading / backtest)
order_fraction: 0.25       # Hvor stor andel av kapitalen per handel (0.25 = 25 %)
fee: 0.001                 # Børsavgift per handel (0.001 = 0.1 %)

# --- Risikostyring (automatisk beskyttelse per handel) --------------------
risk:
  stop_loss_pct: 0.05      # Selg automatisk hvis prisen faller 5 % fra kjøp
  take_profit_pct: 0.10    # Selg automatisk hvis prisen stiger 10 %
  trailing_stop_pct: 0.0   # Flyttende stop (0 = av; f.eks. 0.05 = 5 % under toppen)

# --- Varsler (få beskjed når boten handler) -------------------------------
# Begge kanaler er valgfrie og kan brukes samtidig. Se bot/notify.py for oppsett.
notifications:
  telegram:
    enabled: false         # Sett true når du har fylt inn token + chat_id
    token: ""              # Fra @BotFather i Telegram
    chat_id: ""            # Din chat-id
  email:
    enabled: false         # Sett true når feltene under er fylt inn
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username: ""           # Din e-postadresse (avsender)
    password: ""           # App-passord (IKKE ditt vanlige passord)
    to: ""                 # Hvem varselet skal sendes til

# --- Sikkerhet: EKTE handel ----------------------------------------------
# EKTE handel er slått AV som standard. Start ALLTID med paper trading.
live:
  enabled: false           # Ekstra sikkerhetslås
  max_order_value: 50      # Maks verdi (i quote-valuta, f.eks. USDT) per ordre
  api_key: ""              # Fylles inn KUN når du er klar for ekte handel
  api_secret: ""
